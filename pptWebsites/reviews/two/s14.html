<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Performance Analyzer - Conclusion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
        :root { --p-blue: #2563eb; --text: #111; --border: #cbd5e1; }
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #fff; overflow: hidden; }
        .slide {
            width: 1280px;
            height: 720px;
            background: #fff;
            position: relative;
            padding: 60px 80px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .header { margin-bottom: 5px; }
        .title-text { margin: 0; font-size: 56px; font-weight: 800; color: var(--text); letter-spacing: -1px; }
        .separator { width: 100%; height: 4px; background-color: var(--p-blue); margin: 20px 0 40px 0; border-radius: 2px; }
        .content-box { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; }
        .body-text { font-size: 32px; line-height: 1.6; color: #1a1a1a; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="slide">
        <div class="header"><h1 class="title-text">Conclusion</h1></div>
        <div class="separator"></div>
        <div class="content-box">
            <p class="body-text">A complete solution for student tracking through automation and AI.</p>
            <p class="body-text">The system reduces workload and provides actionable performance insights.</p>
            <p class="body-text">Successfully moving towards a fully functional management platform.</p>
        </div>
    </div>
</body>
</html>
